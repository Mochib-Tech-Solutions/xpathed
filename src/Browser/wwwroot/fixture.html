<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Test page</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 48px; background: #fff; color: #252329; font: 16px/1.4 system-ui, sans-serif; }
    main { max-width: 600px; }
    h1 { font-size: 24px; font-weight: 500; margin: 0 0 24px; }
    label { display: block; font-size: 13px; margin-bottom: 8px; }
    form { display: flex; gap: 10px; }
    input { flex: 1; min-width: 0; padding: 12px; border: 1px solid #ddd9e4; border-radius: 6px; font: inherit; }
    button { padding: 12px 18px; border: 0; border-radius: 6px; background: #7054cd; color: #fff; cursor: pointer; }
    .result { margin: 24px 0; font-size: 14px; }
    output { color: #51436d; overflow-wrap: anywhere; }
    .links { display: flex; gap: 24px; font-size: 14px; }
    a { color: #665087; }
    footer { margin-top: 850px; border-top: 1px solid #eee; padding-top: 24px; font-size: 14px; }
  </style>
</head>
<body>
  <main>
    <h1>Test page</h1>
    <label for="message">Marker</label>
    <form id="marker-form"><input id="message" autocomplete="off" maxlength="160"><button>Update</button></form>
    <p class="result">Current marker: <output id="marker">hello from your browser</output></p>
    <div class="links"><a href="fixture.html?next=1">Navigate this page</a><a href="fixture.html?popup=1" target="_blank">Open new window</a></div>
    <footer>End of page.</footer>
  </main>
  <script>
    document.documentElement.dataset.documentId = crypto.randomUUID();
    document.querySelector('#marker').textContent = localStorage.getItem('marker') ?? 'hello from your browser';
    document.querySelector('#marker-form').addEventListener('submit', event => {
      event.preventDefault();
      document.querySelector('#marker').textContent = document.querySelector('#message').value;
      localStorage.setItem('marker', document.querySelector('#message').value);
    });
  </script>
</body>
</html>
