name: Release Promotion

on:
  pull_request:
    branches: [release]
    types: [closed]

permissions:
  contents: read

concurrency:
  group: paid-evaluation
  cancel-in-progress: false

jobs:
  promotion:
    if: github.event.pull_request.merged && github.event.repository.private && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'main'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
      checks: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.16.0
      - name: Approve the exact tested merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release/promote-pr.mjs
