name: Release Qualification

on:
  pull_request:
    branches: [release]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: paid-evaluation
  cancel-in-progress: false

jobs:
  qualification:
    if: github.event.repository.private && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'main' && !github.event.pull_request.draft
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    permissions:
      contents: write
      checks: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.16.0
      - name: Set up the supported Compose version
        uses: docker/setup-compose-action@54042514f505b273907334ae2b9cdbb9a0213c1a # v2.4.0
        with:
          version: v5.5.1
      - name: Verify prerequisites and evaluate the exact candidate
        env:
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
          OPENROUTER_PROVIDER: ${{ vars.OPENROUTER_PROVIDER }}
          OPENROUTER_EVAL_API_KEY: ${{ secrets.OPENROUTER_EVAL_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          XPATHED_BUDGET_GITHUB_REPOSITORY: ${{ github.repository }}
          XPATHED_ENV_FILE: /dev/null
          XPATHED_EVALUATION_PROJECT: xpathed-evaluation-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          node evaluation/datasets/collection.mjs fetch
          node scripts/release/ci.mjs
      - name: Write the release evaluation summary
        if: success()
        run: node scripts/release/notes.mjs .artifacts/release-ci
      - name: Retain tested images and evidence for merge publication
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate
          path: |
            .artifacts/release-ci/bundle/
            .artifacts/release-ci/receipt.json
            .artifacts/release-ci/monitoring-baseline.json
            .artifacts/release-ci/candidate.json
            .artifacts/release-ci/release-evidence.json.gz
            .artifacts/release-ci/release-notes.md
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Retain private results and original failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .artifacts/release-ci/
            !.artifacts/release-ci/bundle/
            !.artifacts/release-ci/baseline/
            !.artifacts/release-ci/transport/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
