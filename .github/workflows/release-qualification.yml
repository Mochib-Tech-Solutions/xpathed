name: Release qualification

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Preflight checks key/budget only; deterministic checks exact images; live requires fresh qualification labels
        type: choice
        options: [preflight, deterministic, live]
        default: preflight
        required: true
      profile:
        description: One frozen standard-route profile
        type: choice
        options: [deepseek, qwen, gemini, luna, deepseek-concise]
        default: deepseek
        required: true

permissions:
  contents: read

concurrency:
  group: paid-evaluation
  cancel-in-progress: false

jobs:
  qualification:
    if: github.ref == 'refs/heads/main' && github.event.repository.private
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.16.0
      - name: Set up the supported Compose version
        if: inputs.mode != 'preflight'
        uses: docker/setup-compose-action@54042514f505b273907334ae2b9cdbb9a0213c1a # v2.4.0
        with:
          version: v5.5.1
      - name: Verify prerequisites and evaluate the exact candidate
        env:
          RELEASE_MODE: ${{ inputs.mode }}
          RELEASE_PROFILE: ${{ inputs.profile }}
          OPENROUTER_API_KEY: ${{ inputs.mode != 'deterministic' && secrets.OPENROUTER_EVAL_API_KEY || '' }}
          GH_TOKEN: ${{ github.token }}
          XPATHED_BUDGET_GITHUB_REPOSITORY: ${{ github.repository }}
          XPATHED_ENV_FILE: /dev/null
          XPATHED_EVALUATION_PROJECT: xpathed-evaluation-${{ github.run_id }}-${{ github.run_attempt }}
        run: node scripts/release-ci.mjs "$RELEASE_MODE" "$RELEASE_PROFILE"
      - name: Preserve the private candidate bundle without promoting it
        if: always() && inputs.mode != 'preflight'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          bundle=.artifacts/release-ci/bundle
          if [ -f "$bundle/manifest.json" ] && [ -f .artifacts/release-ci/bundle-sha256.txt ]; then
            digest=$(cat .artifacts/release-ci/bundle-sha256.txt)
            node scripts/release-bundle.mjs verify "$bundle" --sha256 "$digest"
            tag="candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            printf 'Packaged candidate; no default activation. Qualification is established only by verified evidence.\n\nManifest SHA-256: %s\nSource: %s\n' "$digest" "$GITHUB_SHA" > .artifacts/release-ci/release-notes.md
            gh release create "$tag" --target "$GITHUB_SHA" --prerelease --title "$tag" --notes-file .artifacts/release-ci/release-notes.md \
              "$bundle/manifest.json" "$bundle/configuration.json" "$bundle/source.tar" "$bundle/images.tar" \
              .artifacts/release-ci/bundle-sha256.txt
          fi
      - name: Retain private results and original failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .artifacts/release-ci/
            !.artifacts/release-ci/bundle/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
