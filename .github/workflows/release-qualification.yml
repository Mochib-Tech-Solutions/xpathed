name: Release Qualification

on:
  pull_request:
    branches: [release]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: paid-evaluation
  cancel-in-progress: false

jobs:
  qualification:
    if: github.event.repository.private && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'main' && !github.event.pull_request.draft
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    permissions:
      contents: write
      checks: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.16.0
      - name: Set up the supported Compose version
        uses: docker/setup-compose-action@54042514f505b273907334ae2b9cdbb9a0213c1a # v2.4.0
        with:
          version: v5.5.1
      - name: Verify prerequisites and evaluate the exact candidate
        env:
          RELEASE_PROFILE: deepseek
          OPENROUTER_EVAL_API_KEY: ${{ secrets.OPENROUTER_EVAL_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          XPATHED_BUDGET_GITHUB_REPOSITORY: ${{ github.repository }}
          XPATHED_ENV_FILE: /dev/null
          XPATHED_EVALUATION_PROJECT: xpathed-evaluation-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          node evaluation/datasets/collection.mjs fetch
          node scripts/release/ci.mjs "$RELEASE_PROFILE"
      - name: Preserve the private candidate bundle without promoting it
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          bundle=.artifacts/release-ci/bundle
          if [ -f "$bundle/manifest.json" ] && [ -f .artifacts/release-ci/bundle-sha256.txt ]; then
            digest=$(cat .artifacts/release-ci/bundle-sha256.txt)
            node scripts/release/bundle.mjs verify "$bundle" --sha256 "$digest"
            mkdir -p .artifacts/release-ci/transport
            gzip -1c "$bundle/images.tar" | split -b 1000000000 -d -a 4 - .artifacts/release-ci/transport/images.tar.gz.part-
            for asset in "$bundle/manifest.json" "$bundle/configuration.json" "$bundle/source.tar" .artifacts/release-ci/transport/images.tar.gz.part-*; do
              if [ "$(stat -c %s "$asset")" -ge 2147483648 ]; then
                echo "Release asset exceeds GitHub's 2 GiB limit: $asset" >&2
                exit 1
              fi
            done
            node scripts/release/notes.mjs .artifacts/release-ci
            tag=$(cat .artifacts/release-ci/release-tag.txt)
            evidence=()
            if [ -f .artifacts/release-ci/release-evidence.json.gz ]; then
              evidence=(.artifacts/release-ci/release-evidence.json.gz .artifacts/release-ci/candidate-sha256.txt)
            fi
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$tag" -f "sha=$GITHUB_SHA" > /dev/null
            gh release create "$tag" --verify-tag --target "$GITHUB_SHA" --draft --prerelease --title "xpathed $tag" --notes-file .artifacts/release-ci/release-notes.md \
              "$bundle/manifest.json" "$bundle/configuration.json" "$bundle/source.tar" .artifacts/release-ci/transport/images.tar.gz.part-* \
              .artifacts/release-ci/bundle-sha256.txt "${evidence[@]}"
            gh release edit "$tag" --draft=false
            node --input-type=module -e '
              import {readFileSync,writeFileSync} from "node:fs";
              const root=".artifacts/release-ci/";
              const receipt={...JSON.parse(readFileSync(root+"preflight.json")), tag:readFileSync(root+"release-tag.txt","utf8").trim(), candidateSha256:readFileSync(root+"candidate-sha256.txt","utf8").trim()};
              writeFileSync(root+"approval-request.json",JSON.stringify(receipt));
            '

          fi
      - name: Retain the exact candidate approval request
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate
          path: .artifacts/release-ci/approval-request.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Retain private results and original failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .artifacts/release-ci/
            !.artifacts/release-ci/bundle/
            !.artifacts/release-ci/baseline/
            !.artifacts/release-ci/transport/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
