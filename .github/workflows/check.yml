name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: true

jobs:
  changes:
    name: Select affected projects
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      dotnet: ${{ steps.select.outputs.dotnet }}
      web: ${{ steps.select.outputs.web }}
      tooling: ${{ steps.select.outputs.tooling }}
      docker: ${{ steps.select.outputs.docker }}
      solution: ${{ steps.select.outputs.solution }}
      browser: ${{ steps.select.outputs.browser }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.16.0
      - name: Select jobs from changed paths
        id: select
        run: node scripts/ci-changes.mjs
      - uses: ./.github/actions/ci-receipt
        with:
          job: changes

  dotnet:
    name: .NET / ${{ matrix.project }}
    needs: changes
    if: needs.changes.outputs.dotnet != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.changes.outputs.dotnet) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: ${{ matrix.project == 'Browser' || matrix.project == 'ClientApi' }}
          cache-dependency-path: |
            src/Common/packages.lock.json
            src/${{ matrix.project }}/packages.lock.json
            tests/${{ matrix.project }}.*Tests/packages.lock.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.16.0
      - name: Restore locked dependencies
        run: dotnet restore "src/${{ matrix.project }}/${{ matrix.project }}.csproj" --locked-mode
      - name: Restore pinned formatter and migration tools
        run: dotnet tool restore
      - name: Check C# formatting
        run: |
          dotnet format style "src/${{ matrix.project }}/${{ matrix.project }}.csproj" --no-restore --verify-no-changes
          dotnet csharpier check "src/${{ matrix.project }}"
      - name: Build and enforce analyzers
        run: dotnet build "src/${{ matrix.project }}/${{ matrix.project }}.csproj" --no-restore --configuration Release -p:ContinuousIntegrationBuild=true
      - name: Run associated C# tests
        run: node scripts/ci-dotnet-tests.mjs "${{ matrix.project }}"
      - uses: ./.github/actions/ci-receipt
        with:
          job: dotnet-${{ matrix.project }}

  solution:
    name: .NET / Solution
    needs: changes
    if: needs.changes.outputs.solution == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.16.0
      - name: Restore the solution with locked dependencies
        run: dotnet restore Xpathed.slnx --locked-mode
      - name: Build the solution and validate its project entries
        run: dotnet build Xpathed.slnx --no-restore --configuration Release -p:ContinuousIntegrationBuild=true
      - uses: ./.github/actions/ci-receipt
        with:
          job: solution

  web:
    name: Web
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: pnpm/setup@c9883cc79df532ad1a7b81bf9ab944ceb090d65c # v2.0.0
        with:
          runtime: node@24.16.0
          cache: true
          install: false
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Check formatting, lint, build and tests in parallel
        run: pnpm check:web
      - uses: ./.github/actions/ci-receipt
        with:
          job: web

  tooling:
    name: Repository tooling
    needs: changes
    if: needs.changes.outputs.tooling == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: pnpm/setup@c9883cc79df532ad1a7b81bf9ab944ceb090d65c # v2.0.0
        with:
          runtime: node@24.16.0
          cache: true
          install: false
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Check tooling in parallel
        run: pnpm check:tooling
      - uses: ./.github/actions/ci-receipt
        with:
          job: tooling

  docker:
    name: Docker configuration
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.16.0
      - name: Set up the supported Compose version
        uses: docker/setup-compose-action@54042514f505b273907334ae2b9cdbb9a0213c1a # v2.4.0
        with:
          version: v5.5.1
      - name: Validate Compose and Dockerfiles without building images
        run: scripts/ci-docker.sh
      - uses: ./.github/actions/ci-receipt
        with:
          job: docker

  browser:
    name: Live-browser Resolver (controlled provider-free)
    needs: changes
    if: needs.changes.outputs.browser == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: pnpm/setup@c9883cc79df532ad1a7b81bf9ab944ceb090d65c # v2.0.0
        with:
          runtime: node@24.16.0
          install: false
      - name: Set up the supported Compose version
        uses: docker/setup-compose-action@54042514f505b273907334ae2b9cdbb9a0213c1a # v2.4.0
        with:
          version: v5.5.1
      - name: Run the complete Live-browser Resolver suite with controlled provider-free responses
        shell: bash
        env:
          XPATHED_EVALUATION_PROJECT: xpathed-evaluation-${{ github.run_id }}-${{ github.run_attempt }}
          XPATHED_ENV_FILE: /dev/null
          OPENROUTER_API_KEY: ""
        run: |
          mkdir -p .artifacts/ci
          pnpm evaluate:resolver --mode deterministic --concurrency 4 --output .artifacts/ci/browser 2>&1 | tee .artifacts/ci/browser.log
      - uses: ./.github/actions/ci-receipt
        with:
          job: browser
      - name: Retain private Live-browser Resolver evidence even on failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-evidence-${{ github.run_attempt }}
          path: |
            .artifacts/ci/browser/
            .artifacts/ci/browser.log
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  check:
    name: Check
    needs: [changes, dotnet, solution, web, tooling, docker, browser]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.16.0
      - name: Download this attempt's job receipts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ci-receipt-*-${{ github.run_attempt }}
          path: .artifacts/ci/receipts
          merge-multiple: true
      - name: Download selected Live-browser Resolver evidence for independent replay
        if: always() && needs.changes.outputs.browser == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: browser-evidence-${{ github.run_attempt }}
          path: .artifacts/ci
      - name: Require complete successful checks for this revision
        if: always()
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: node scripts/ci-gate.mjs verify
      - name: Retain the aggregate decision even on failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-gate-${{ github.run_attempt }}
          path: .artifacts/ci/gate.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90

  deploy:
    name: Deploy hosted workspace
    needs: check
    if: ${{ !cancelled() && needs.check.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: hosted-workspace-deployment
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.16.0
      - name: Deploy changed application inputs after successful checks
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: node scripts/deployment.mjs
