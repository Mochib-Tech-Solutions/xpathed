name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.16.0
          cache: npm
          cache-dependency-path: src/Web/package-lock.json
      - name: Lint, format, and build all projects
        run: scripts/check.sh
      - name: Configure local services
        run: scripts/setup.sh
      - name: Build Docker services
        run: docker compose --profile test build
      - name: Check browser workflows and restart recovery
        run: scripts/smoke.sh
      - name: Collect service logs on failure
        if: failure()
        run: |
          if [ -f .env ]; then
            mkdir -p artifacts/smoke
            docker compose logs --no-color --timestamps > artifacts/smoke/compose.log
          fi
      - name: Save smoke evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smoke-evidence
          path: |
            artifacts/smoke/*.png
            artifacts/smoke/compose.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop local services
        if: always()
        run: |
          if [ -f .env ]; then
            docker compose down --volumes --remove-orphans
          fi
