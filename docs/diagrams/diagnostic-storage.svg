<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="740" viewBox="0 0 1100 740" role="img" aria-labelledby="title desc">
  <title id="title">xpathed diagnostic storage</title>
  <desc id="desc">ClientApi writes one PostgreSQL table, diagnostic_records. Each application attempt has one row, initially pending and later completed. Imported diagnostic artifacts also use this table. Scalar identifiers and timestamps support lookup and retention; three JSONB columns store result, evidence and provenance. There are no foreign keys to live browser objects.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#d3b878" stroke-width="1.5"/></marker></defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #e6edf3; }
    .muted { fill: #adb8c6; }
    .field { font-family: 'SFMono-Regular', Consolas, monospace; font-size: 15px; }
    .small { font-size: 15px; }
  </style>
  <rect width="1100" height="740" rx="16" fill="#0d1117"/>
  <text x="36" y="46" font-size="26" font-weight="600">Diagnostic storage</text>
  <text x="36" y="76" class="muted" font-size="17">One application table. Live browser state stays in memory.</text>
  <rect x="36" y="116" width="256" height="482" rx="10" fill="#161b22" stroke="#374151"/>
  <text x="56" y="148" font-size="20" font-weight="600">ClientApi</text>
  <text x="56" y="175" class="small muted">Owns EF Core persistence</text>
  <path d="M292 153 H374" fill="none" stroke="#d3b878" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="317" y="137" class="small">write</text>
  <text x="56" y="226" class="small" font-weight="600">Application attempt</text>
  <text x="56" y="251" class="small muted">Create Id with pending state</text>
  <text x="56" y="276" class="small muted">Update the same Id on finish</text>
  <text x="56" y="301" class="small muted">A retry receives a new Id</text>
  <path d="M56 325 H272" stroke="#374151"/>
  <text x="56" y="355" class="small" font-weight="600">Three embedded documents</text>
  <text x="56" y="382" class="small muted">Result: outcomes and costs</text>
  <text x="56" y="407" class="small muted">Evidence: sanitized capture</text>
  <text x="56" y="432" class="small muted">Provenance: source and version</text>
  <path d="M56 456 H272" stroke="#374151"/>
  <text x="56" y="488" class="small" font-weight="600">Retention defaults</text>
  <text x="56" y="515" class="small muted">Records: 90 days</text>
  <text x="56" y="540" class="small muted">Page evidence: 30 days</text>
  <text x="56" y="572" font-size="13" class="muted">Approved artifacts may be retained.</text>
  <rect x="382" y="116" width="682" height="482" rx="10" fill="#161b22" stroke="#556273"/>
  <text x="404" y="148" class="field" font-weight="700" style="font-size:20px">diagnostic_records</text>
  <text x="1028" y="146" text-anchor="end" class="small muted">PostgreSQL</text>
  <path d="M382 166 H1064" stroke="#556273"/>
  <text x="404" y="191" class="small muted">Column</text><text x="690" y="191" class="small muted">Type</text><text x="949" y="191" class="small muted">Constraint</text>
  <text x="404" y="222" class="field">Id</text><text x="690" y="222" class="field muted">varchar(80)</text><text x="949" y="222" class="small muted">PK</text>
  <text x="404" y="250" class="field">Kind</text><text x="690" y="250" class="field muted">varchar(40)</text><text x="949" y="250" class="small muted"></text>
  <text x="404" y="278" class="field">TraceId</text><text x="690" y="278" class="field muted">varchar(128)</text><text x="949" y="278" class="small muted"></text>
  <text x="404" y="306" class="field">PageId</text><text x="690" y="306" class="field muted">varchar(128)</text><text x="949" y="306" class="small muted"></text>
  <text x="404" y="334" class="field">Outcome</text><text x="690" y="334" class="field muted">varchar(40)</text><text x="949" y="334" class="small muted"></text>
  <text x="404" y="362" class="field">CreatedAt</text><text x="690" y="362" class="field muted">timestamptz</text><text x="949" y="362" class="small muted"></text>
  <text x="404" y="390" class="field">ExpiresAt</text><text x="690" y="390" class="field muted">timestamptz</text><text x="949" y="390" class="small muted">nullable</text>
  <text x="404" y="418" class="field">EvidenceExpiresAt</text><text x="690" y="418" class="field muted">timestamptz</text><text x="949" y="418" class="small muted">nullable</text>
  <text x="404" y="446" class="field">EvidenceAvailability</text><text x="690" y="446" class="field muted">varchar(80)</text><text x="949" y="446" class="small muted"></text>
  <text x="404" y="474" class="field">ResultJson</text><text x="690" y="474" class="field muted">jsonb</text><text x="949" y="474" class="small muted"></text>
  <text x="404" y="502" class="field">EvidenceJson</text><text x="690" y="502" class="field muted">jsonb</text><text x="949" y="502" class="small muted">nullable</text>
  <text x="404" y="530" class="field">ProvenanceJson</text><text x="690" y="530" class="field muted">jsonb</text><text x="949" y="530" class="small muted"></text>
  <text x="404" y="558" class="field">ImportHash</text><text x="690" y="558" class="field muted">varchar(64)</text><text x="949" y="558" class="small muted">nullable</text>
  <text x="36" y="637" font-size="17" font-weight="600">Indexes</text>
  <text x="136" y="637" class="field">ExpiresAt · EvidenceExpiresAt · (PageId, CreatedAt)</text>
  <text x="36" y="674" class="small muted">PageId and TraceId are correlation values, not foreign keys. JSON documents are columns, not child tables.</text>
  <text x="36" y="704" class="small muted">All columns are required unless marked nullable. No JSONB query index is configured.</text>
</svg>
