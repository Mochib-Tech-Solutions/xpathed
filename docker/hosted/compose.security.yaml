# Merge these settings into the private compose.hosted.yaml during host setup.
# Do not apply this profile to development or trusted evaluation stacks.
services:
  browser:
    entrypoint: ["sh", "/usr/local/bin/xpathed-egress-wait", "dotnet", "Browser.dll"]
    volumes:
      - ${XPATHED_DEPLOY_DIRECTORY:?Set the absolute private deploy directory}/browser-entrypoint.sh:/usr/local/bin/xpathed-egress-wait:ro
    mem_limit: 4g
    cpus: 2.5
    pids_limit: 1024
  resolver:
    mem_limit: 512m
    cpus: 1
    pids_limit: 128
  client-api:
    mem_limit: 384m
    cpus: 0.5
    pids_limit: 128
  web:
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 128
  gateway:
    image: caddy@sha256:881bbc60f9986d5ab8e7cfd6cf7e4ef3c9c0439fef2429d035d065577882f028
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 128
