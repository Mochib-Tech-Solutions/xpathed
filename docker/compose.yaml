name: xpathed
services:
  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
      target: runtime
    ports: ["127.0.0.1:${XPATHED_PORT:-8080}:8080"]
    depends_on: [client-api, browser]
  client-api:
    build: { context: ., dockerfile: docker/client-api/Dockerfile, target: runtime }
    environment:
      BrowserUrl: http://browser:8080
      ResolverUrl: http://resolver:8080
      RateLimits__RequestsPerMinute: ${API_REQUESTS_PER_MINUTE:-120}
      RateLimits__ConcurrentRequests: ${API_CONCURRENT_REQUESTS:-8}
      Logging__LogLevel__Default: Warning
    depends_on:
      resolver: { condition: service_started }
  resolver:
    build: { context: ., dockerfile: docker/resolver/Dockerfile, target: runtime }
    environment:
      BrowserUrl: http://browser:8080
      OpenRouter__BaseUrl: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1/}
      OpenRouter__TimeoutSeconds: ${OPENROUTER_TIMEOUT_SECONDS:-30}
      OpenRouter__ApiKey: ${OPENROUTER_API_KEY:-}
      OpenRouter__Model: ${OPENROUTER_MODEL:-deepseek/deepseek-v4.1-flash}
      OpenRouter__Provider: ${OPENROUTER_PROVIDER:-wafer}
      RateLimits__RequestsPerMinute: ${API_REQUESTS_PER_MINUTE:-120}
      RateLimits__ConcurrentRequests: ${API_CONCURRENT_REQUESTS:-8}
      ModelUsage__CallsPerMinute: ${MODEL_CALLS_PER_MINUTE:-20}
      ModelUsage__CallsPerDay: ${MODEL_CALLS_PER_DAY:-1000}
      ModelUsage__ConcurrentCalls: ${MODEL_CONCURRENT_CALLS:-2}
      Logging__LogLevel__Default: Warning
    depends_on: [browser]
  browser:
    build: { context: ., dockerfile: docker/browser/Dockerfile, target: runtime }
    init: true
    shm_size: 1gb
    security_opt: ["seccomp=./docker/browser/seccomp.json"]
    environment:
      ViewerOrigins: http://localhost:${XPATHED_PORT:-8080},http://127.0.0.1:${XPATHED_PORT:-8080}
      DefaultBrowserType: ${BROWSER_TYPE:-chromium}
      MaxSessions: 4
      Logging__LogLevel__Default: Warning
    stop_grace_period: 20s
