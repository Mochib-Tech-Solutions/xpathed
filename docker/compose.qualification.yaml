x-qualification-environment: &qualification-environment
  BrowserUrl: http://browser:8080
  OpenRouter__BaseUrl: http://evaluation-fixture:8091/api/v1/
  OpenRouter__ApiKey: qualification-proxy-only
  Logging__LogLevel__Default: Warning

services:
  resolver:
    environment:
      <<: *qualification-environment
      OpenRouter__Model: ${OPENROUTER_MODEL:-deepseek/deepseek-v4.1-flash}
      OpenRouter__Provider: ${OPENROUTER_PROVIDER:-wafer}
  evaluation-fixture:
    environment:
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-deepseek/deepseek-v4.1-flash}
      OPENROUTER_PROVIDER: ${OPENROUTER_PROVIDER:-wafer}
      OPENROUTER_EVAL_API_KEY: ${OPENROUTER_EVAL_API_KEY:-}
      XPATHED_BUDGET_PATH: /budget/charges.json
      XPATHED_BUDGET_GITHUB_REPOSITORY: ${XPATHED_BUDGET_GITHUB_REPOSITORY:-}
      GH_TOKEN: ${GH_TOKEN:-}
    volumes:
      - ./.artifacts/accounting:/budget
