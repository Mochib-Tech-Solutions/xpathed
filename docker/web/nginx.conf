map $http_upgrade $connection_upgrade { default upgrade; '' close; }
map $http_origin $request_origin {
    default $http_origin;
    "" "$scheme://$http_host";
}
server {
    listen 8080 default_server;
    server_name _;
    return 444;
}
server {
    listen 8080;
    server_name localhost 127.0.0.1 web;
    server_tokens off;
    root /usr/share/nginx/html;
    client_max_body_size 16k;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Cache-Control no-store always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; object-src 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' ws://$http_host wss://$http_host; frame-ancestors 'none'" always;
    location /api/ {
        set $expected_origin "$scheme://$http_host";
        if ($request_origin != $expected_origin) { return 403; }
        proxy_hide_header Cache-Control;
        proxy_pass http://client-api:8080;
        proxy_set_header Host $http_host;
        proxy_read_timeout 50s;
    }
    location = /view/health { proxy_pass http://browser:8080/health; }
    location /view/ {
        proxy_pass http://browser:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
        proxy_buffering off;
    }
    location = /health { proxy_pass http://client-api:8080/health; }
    location /internal/ { return 404; }
    location ~ /\. { return 404; }
    location / { try_files $uri $uri/ /index.html; }
}
