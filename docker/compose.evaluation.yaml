services:
  browser:
    environment:
      DefaultBrowserType: chromium
  resolver:
    environment:
      OpenRouter__BaseUrl: http://evaluation-fixture:8090/api/v1/
      OpenRouter__ApiKey: deterministic-fixture-only
      OpenRouter__Model: deepseek/deepseek-v4.1-flash
      OpenRouter__Provider: wafer
      # Admission quotas do not replace the frozen evaluation plan or key budget.
      RateLimits__RequestsPerMinute: 100000
      RateLimits__ConcurrentRequests: 32
      ModelUsage__CallsPerMinute: 100000
      ModelUsage__CallsPerDay: 100000
      ModelUsage__ConcurrentCalls: 32
  evaluation-fixture:
    image: node:24.16.0-bookworm-slim@sha256:2c87ef9bd3c6a3bd4b472b4bec2ce9d16354b0c574f736c476489d09f560a203
    user: "${XPATHED_EVALUATION_UID:-0}:${XPATHED_EVALUATION_GID:-0}"
    working_dir: /evaluation
    environment:
      XPATHED_WORKSPACE: /workspace
      XPATHED_CODE_REVISION: ${XPATHED_CODE_REVISION:-unavailable}
      XPATHED_TREE_HASH: ${XPATHED_TREE_HASH:-unavailable}
      XPATHED_EVALUATION_SUITE: ${XPATHED_EVALUATION_SUITE:-}
    volumes:
      - ./evaluation:/evaluation:ro
      - ./tests/resolution:/checks:ro
      - .:/workspace:ro
      - type: bind
        source: ${XPATHED_EVALUATION_OUTPUT:?Set the evaluation artifact directory}
        target: /artifacts
    command: ["node", "fixtures/server.mjs"]
