name: xpathed
services:
  web:
    build:
      context: .
      dockerfile: src/Web/Dockerfile
      target: runtime
    ports: ["127.0.0.1:${XPATHED_PORT:-8080}:8080"]
    depends_on: [client-api, browser]
  client-api:
    build: { context: ., dockerfile: src/ClientApi/Dockerfile, target: runtime }
    environment:
      BrowserUrl: http://browser:8080
      ResolverUrl: http://resolver:8080
      ConnectionStrings__Database: Host=db;Database=xpathed;Username=xpathed;Password=${POSTGRES_PASSWORD:?Run scripts/setup.sh first}
      Logging__LogLevel__Default: Warning
    depends_on:
      db: { condition: service_healthy }
      resolver: { condition: service_started }
  resolver:
    build: { context: ., dockerfile: src/Resolver/Dockerfile, target: runtime }
    environment:
      BrowserUrl: http://browser:8080
      Logging__LogLevel__Default: Warning
    depends_on: [browser]
  browser:
    build: { context: ., dockerfile: src/Browser/Dockerfile, target: runtime }
    init: true
    shm_size: 1gb
    security_opt: ["seccomp=./infra/browser-seccomp.json"]
    environment:
      ViewerOrigins: http://localhost:${XPATHED_PORT:-8080},http://127.0.0.1:${XPATHED_PORT:-8080}
      MaxSessions: 4
      Logging__LogLevel__Default: Warning
    stop_grace_period: 20s
  db:
    image: postgres:18.6-bookworm@sha256:3725f4e2499eef5134592b3b4ab79a543ed7f8e533b05b5b637af926630f6650
    environment:
      POSTGRES_USER: xpathed
      POSTGRES_DB: xpathed
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/setup.sh first}
    volumes: ["postgres:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xpathed -d xpathed"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  postgres:
