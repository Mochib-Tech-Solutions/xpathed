title = "xpathed credential checks"

[extend]
useDefault = true

[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "Source-file SHA256 provenance, not credentials"
condition = "AND"
paths = ['''docs/assets/evaluation/.*\.json$''']
regexTarget = "match"
regexes = ['''^Api(Error|ErrorHandling|Exception)\.cs": "[a-f0-9]{64}"$''']

[[rules.allowlists]]
description = "Historical evaluation prose, not a credential assignment"
condition = "AND"
paths = ['''^(docs/evaluation\.md|scripts/security-check\.mjs)$''']
regexTarget = "match"
regexes = ['''^API contracts, missing/duplicate $''']

[[rules.allowlists]]
description = "Exact dummy value used to test credential redaction"
condition = "AND"
paths = ['''^(tests/Resolver\.Tests/(ResolutionContractTests|ProviderContractTests)\.cs|scripts/security-check\.mjs)$''']
regexTarget = "match"
regexes = ['''^API_KEY=violet-cactus-782"$''']

[[rules.allowlists]]
description = "Exact fixed nonsecret UUID fixture for Browser startup nonce tests"
condition = "AND"
paths = ['''^(scripts/deployment-network\.test\.py|scripts/security-check\.mjs)$''']
regexTarget = "match"
regexes = ['''^TOKEN = "aabbccdd-0011-2233-4455-66778899aabb"$''']
